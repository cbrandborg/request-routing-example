[project]
name = "request-routing"
version = "0.1.0"
description = "Prototype multi-agent router for customer messages to a bank."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Christian Brandborg" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp-slim[server]>=4.1.3",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-ai-slim[cli,mcp,openai]>=2.59.0",
    "pydantic-evals>=2.59.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# Run from the repository root with `uv run python -m request_routing`; the project itself is not installed.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
